[project]
name = "manciasolutions-editor-de-video"
version = "1.0.0"
description = "Skill de edição de vídeo conversacional para Claude Code"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# Detecção de batida melhor (o fallback em numpy funciona sem isso)
music = ["librosa"]
# Auto-reframe seguindo rosto (sem isso, cai para energia de movimento).
#
# Sem pin de versão de propósito: as duas gerações funcionam. O detector bom
# (FaceDetectorYN / YuNet) existe nas duas desde o 4.5.4 e precisa de um .onnx
# de ~232 KB baixado à parte — o reframe.py imprime o comando quando falta. O
# Haar cascade, que vem dentro do wheel do 4.x e sumiu no 5.x, fica só como
# reserva: no material de teste deste repo ele acerta 0/12 onde o YuNet acerta
# 12/12.
vision = ["opencv-python-headless"]
# Transcrição local sem chave da ElevenLabs
local-asr = ["faster-whisper"]
# Gráficos do timeline_view
viz = ["matplotlib"]
# Animações formais
animations = ["manim"]
# Tudo que não é pesado demais
full = ["librosa", "opencv-python-headless", "faster-whisper", "matplotlib"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
