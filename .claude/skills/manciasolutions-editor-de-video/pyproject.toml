[project]
name = "manciasolutions-editor-de-video"
version = "1.0.0"
description = "Skill de edição de vídeo conversacional para Claude Code"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# Detecção de batida melhor (o fallback em numpy funciona sem isso)
music = ["librosa"]
# Auto-reframe seguindo rosto (sem isso, cai para energia de movimento).
#
# Sem pin de versão de propósito: as duas gerações funcionam, por caminhos
# diferentes. O OpenCV 4.x traz Haar cascade dentro do wheel e roda sem mais
# nada. O 5.x REMOVEU os cascades e só tem FaceDetectorYN (YuNet), melhor, mas
# que precisa de um .onnx de ~232 KB baixado à parte — o reframe.py imprime o
# comando quando falta. Prender em <5 evitaria esse passo ao custo de travar o
# usuário numa major antiga.
vision = ["opencv-python-headless"]
# Transcrição local sem chave da ElevenLabs
local-asr = ["faster-whisper"]
# Gráficos do timeline_view
viz = ["matplotlib"]
# Animações formais
animations = ["manim"]
# Tudo que não é pesado demais
full = ["librosa", "opencv-python-headless", "faster-whisper", "matplotlib"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
